name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Derleme (Spigot 1.16.5 API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven package
        run: |
          set -o pipefail
          mvn -B -ntp clean package 2>&1 | tee build.log
      - name: Derleme hatalarını göster
        if: failure()
        run: grep -E "\[(ERROR|WARNING)\]" build.log | head -60 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
      - name: Jar doğrulama
        run: |
          set -e
          JAR=$(ls target/Dunyalar-*.jar)
          unzip -p "$JAR" plugin.yml
          if unzip -p "$JAR" plugin.yml | grep -q 'project.version'; then echo "plugin.yml filtrelenmemiş"; exit 1; fi
          unzip -p "$JAR" plugin.yml | grep -q 'dünya:'
          unzip -o -q "$JAR" -d jarcheck
          MAJOR=$(javap -v jarcheck/com/dunyalar/Dunyalar.class | awk '/major version/ {print $3}')
          echo "Class major version: $MAJOR"
          [ "$MAJOR" = "52" ]
      - uses: actions/upload-artifact@v5
        with:
          name: Dunyalar
          path: target/Dunyalar-*.jar
          if-no-files-found: error

  compat:
    name: API uyumluluğu (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [spigot-1.21, paper-1.21]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Derle (${{ matrix.profile }})
        run: |
          set -o pipefail
          mvn -B -ntp -P ${{ matrix.profile }} clean compile 2>&1 | tee build.log
      - name: Derleme hatalarını göster
        if: failure()
        run: grep -E "\[(ERROR|WARNING)\]" build.log | head -60 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done

  smoke:
    name: Gerçek sunucu testi (Paper ${{ matrix.mc }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.16.5', java: '11' }
          - { mc: '1.17.1', java: '17' }
          - { mc: '1.18.2', java: '17' }
          - { mc: '1.19.4', java: '17' }
          - { mc: '1.20.4', java: '17' }
          - { mc: '1.20.6', java: '21' }
          - { mc: '1.21.4', java: '21' }
          - { mc: 'latest-1.21', java: '21' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v5
        with:
          name: Dunyalar
          path: dist
      - name: Bot bağımlılıkları
        run: npm install --prefix ci --no-audit --no-fund mineflayer@4
      - name: Uçtan uca test
        run: bash ci/smoke.sh '${{ matrix.mc }}' dist/Dunyalar-*.jar bot
      - name: Günlükleri yükle
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-logs-${{ matrix.mc }}
          path: |
            smoke-*/logs/
            smoke-*/console.out
            smoke-*/bot.out
            smoke-*/all.log
            smoke-*/plugins/Dunyalar/
          if-no-files-found: ignore

  release:
    name: Release
    needs: [build, compat, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: Dunyalar
          path: dist
      - name: GitHub Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.jar --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.jar --title "Dunyalar $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
