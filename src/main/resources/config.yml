# ==============================================================
#  Dunyalar - Ana Ayar Dosyası
#  Değişiklikleri oyuna uygulamak için:  /dünya reload
#  Renk kodları: &a, &b ...   HEX renk (1.16+): &#00FFAA
# ==============================================================

prefix: "&8[&bDünyalar&8] &r"

# ------------------------------------------------------------
#  Dünya oluşturma
# ------------------------------------------------------------
olusturma:
  # Komuttaki boyut (örn. 1000x1000) nasıl yorumlansın?
  #   yaricap -> merkezden X yönünde 1000, Z yönünde 1000 blok (alan: 2000x2000)
  #   toplam  -> toplam alan 1000x1000 blok (merkezden 500'er blok)
  boyut-modu: yaricap
  # Komutta yazılabilecek en küçük / en büyük sayı
  min-boyut: 5
  maks-boyut: 50000
  # Dünya adı kuralı (klasör adı olarak kullanılır). Desen ne olursa olsun klasör güvenliği için
  # yalnızca A-Z a-z 0-9 _ - karakterleri kabul edilir; bu desen ek kısıt koymak içindir.
  isim-deseni: "^[A-Za-z0-9_-]{1,32}$"
  # Boş bırakılırsa rastgele tohum (seed) kullanılır
  tohum: ""
  # Normal tipteki dünyalarda köy, kale vb. yapılar oluşsun mu?
  yapilar: true
  # Chat'e ilerleme mesajı kaç saniyede bir gönderilsin?
  ilerleme-araligi: 2
  # İlerleme çubuğunun uzunluğu (karakter)
  ilerleme-cubugu-uzunlugu: 20
  # Dünya hazır olduğunda oynatılacak ses (boş = kapalı)
  tamamlandi-sesi: "minecraft:ui.toast.challenge_complete"

# ------------------------------------------------------------
#  Ön yükleme (oluşturma sırasında arazinin önceden üretilmesi)
#  Oyuncular dünyaya girdiğinde lag olmaması için yapılır.
# ------------------------------------------------------------
on-yukleme:
  aktif: true
  # Merkezden en fazla kaç bloğa kadar önceden üretilsin? (Çok büyük dünyalarda sunucuyu yormamak için)
  maks-yaricap: 512
  # Spigot: her tick'te ön yüklemeye ayrılacak en fazla süre (milisaniye). Düşük = TPS dostu.
  tick-butcesi-ms: 15
  # Paper: aynı anda asenkron üretilecek chunk sayısı
  paralel-chunk: 16

# ------------------------------------------------------------
#  Sınır (mavi dünya sınırı)
# ------------------------------------------------------------
sinir:
  # Sınır dışında kalan oyuncuya saniyede verilecek hasar (blok başına)
  hasar: 1.0
  hasar-tamponu: 0.0
  # Sınıra kaç blok kala ekran kızarsın
  uyari-mesafesi: 5
  uyari-suresi: 10
  # Sınıra çarpınca aksiyon bar mesajı gösterilsin mi?
  aksiyon-bar-mesaji: true
  # Sınır dışına ender incisi / koro meyvesi ile geçişi engelle
  firlatma-engelle: true

# ------------------------------------------------------------
#  Void dünyalar
#  Not: Void dünyalarda eklenti hiçbir yükseklik kısıtı koymaz; sınır tüm yüksekliği kaplar.
# ------------------------------------------------------------
void:
  platform:
    # Merkezde oyuncuların düşmemesi için küçük bir platform
    aktif: true
    blok: BEDROCK
    # 1 => 3x3, 2 => 5x5
    yaricap: 1
    y: 64

# ------------------------------------------------------------
#  Flat dünyalar - katmanlar alttan üste (ilk satır en alt kat)
# ------------------------------------------------------------
flat:
  katmanlar:
    world:
      - BEDROCK
      - DIRT
      - DIRT
      - DIRT
      - GRASS_BLOCK
    nether:
      - BEDROCK
      - NETHERRACK
      - NETHERRACK
      - NETHERRACK
      - NETHERRACK
    end:
      - BEDROCK
      - END_STONE
      - END_STONE
      - END_STONE
      - END_STONE

# ------------------------------------------------------------
#  Void ve flat dünyalarda kullanılacak biyom
#  (Gökyüzü, sis, ortam sesleri ve müzik biyoma göre gelir)
# ------------------------------------------------------------
biyomlar:
  world: plains
  nether: nether_wastes
  end: the_end

# ------------------------------------------------------------
#  End dünyaları
# ------------------------------------------------------------
end:
  # Ejderha savaşı hangi tiplerde olsun?
  ejderha:
    normal: true
    flat: false
    void: false
  # Ejderha savaşı olan End dünyalarında merkeze ışınlanırken çıkış portalının
  # üstüne düşmemek için merkezden kaç blok yana ışınlansın
  merkez-ofset: 12

# ------------------------------------------------------------
#  Oluşturulan dünyalara uygulanan ayarlar (reload ile güncellenir)
# ------------------------------------------------------------
dunya-ayarlari:
  pvp: true
  # PEACEFUL, EASY, NORMAL, HARD
  zorluk: NORMAL
  canavar-spawn: true
  hayvan-spawn: true
  # Spawn chunk'ları sürekli bellekte tutulsun mu? (false = daha az RAM/TPS kullanımı)
  spawn-bellekte-tut: false

# ------------------------------------------------------------
#  Işınlanma
# ------------------------------------------------------------
isinlanma:
  baslik: true
  ses: "minecraft:entity.enderman.teleport"
  # Merkezde güvenli yer bulunamazsa etrafta kaç blok aransın
  guvenli-arama-yaricapi: 8
  # Hiç güvenli yer yoksa ayağının altına küçük bir platform koy
  zemin-yoksa-platform: true
  platform-blok: COBBLESTONE

# ------------------------------------------------------------
#  Ölünce yeniden doğma
# ------------------------------------------------------------
yeniden-dogma:
  # Eklentinin dünyalarında ölen oyuncu o dünyanın spawn noktasında doğar
  aktif: true
  # true: oyuncunun yatağı / respawn anchor'ı varsa önce oraya doğsun
  yatak-oncelikli: false

